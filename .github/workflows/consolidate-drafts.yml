name: Consolidate multi-AI drafts

# Explicit dispatch only. Runs scripts/consolidate_pipeline.py on the pages of the data repository: the writer
# model (pinned through the AI gateway) weaves the drafts into one text, code checks it and retries. Results
# (fact records and a report) go to a private branch of the data repository; nothing is merged. The log prints
# counts only.
on:
  workflow_dispatch:
    inputs:
      data_ref:
        description: Branch of the data repository holding the pages
        required: true
        type: string
      pages:
        description: Space-separated page names in content/05_Multi_AI (without .md)
        required: true
        type: string
      model:
        description: Exact id of the writer model (from /v1/models)
        required: false
        type: string
        default: nvidia/nemotron-3-ultra-550b-a55b:free

permissions:
  contents: read

concurrency:
  group: source-first-v2-1
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.pages }}
    steps:
      - id: pages
        env:
          PAGES: ${{ inputs.pages }}
        run: |
          set -euo pipefail
          for p in $PAGES; do
            if [[ ! "$p" =~ ^[a-z0-9-]+$ ]]; then echo "bad page name"; exit 1; fi
          done
          echo "pages=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1].split()))' "$PAGES")" >> "$GITHUB_OUTPUT"

  consolidate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        page: ${{ fromJSON(needs.plan.outputs.pages) }}
    steps:
      - name: Check out private research data
        uses: actions/checkout@v7
        with:
          repository: zenkio/hk-history-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
          ref: ${{ inputs.data_ref }}
          fetch-depth: 0

      - name: Check out research code
        uses: actions/checkout@v7
        with:
          path: _code
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Overlay research code in isolated workspace
        run: |
          set -euo pipefail
          rsync -a --exclude .git --exclude .github --exclude .gitignore \
            --exclude README.md --exclude CLAUDE.md --exclude LICENSE \
            --exclude CODE_OF_CONDUCT.md _code/ data/
          rm -rf _code

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Consolidate the pages
        working-directory: data
        env:
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          PAGE: ${{ matrix.page }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          mkdir -p experiments/consolidate/reports
          if [[ ! -f "content/05_Multi_AI/$PAGE.md" ]]; then echo "no such page"; exit 1; fi
          python3 -u scripts/consolidate_pipeline.py "content/05_Multi_AI/$PAGE.md" "data/consolidated_facts/$PAGE.json" \
            --model "$MODEL" --report "experiments/consolidate/reports/$PAGE.json" || true

      - name: Save results to a private branch
        if: always()
        working-directory: data
        env:
          PRIVATE_BRANCH: experiment/consolidate-${{ github.run_id }}-${{ matrix.page }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$PRIVATE_BRANCH"
          git add data/consolidated_facts experiments/consolidate
          if git diff --cached --quiet; then echo "nothing was written"; exit 0; fi
          git commit -m "experiment: consolidate drafts"
          git push origin "$PRIVATE_BRANCH"
