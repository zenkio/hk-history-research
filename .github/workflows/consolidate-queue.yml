name: Consolidate queue (auto)

# trigger run 2
# Runs the multi-AI page pipeline from the list in data/consolidated_queue.json of the private data repository
# (scripts/consolidate_queue.py): only the steps a page still needs, self-healing within bounds, unresolved
# problems written to data/consolidated_status/_issues.json. Results go to the private branch
# auto/consolidate-queue of the data repository; nothing is merged and the live site is not touched.
# Scheduled runs happen only while the repository variable QUEUE_ON is "on" (and only from the default branch).
on:
  workflow_dispatch:
    inputs:
      data_ref:
        description: Branch of the data repository holding the pages and the queue
        required: false
        type: string
        default: ''
      model:
        description: Exact id of the writer model (from /v1/models)
        required: false
        type: string
        default: nvidia/nemotron-3-ultra-550b-a55b:free
  push:
    branches:
      - 'queue-run/**'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: source-first-v2-1
  cancel-in-progress: false

jobs:
  queue:
    if: github.event_name != 'schedule' || vars.QUEUE_ON == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out private research data
        uses: actions/checkout@v7
        with:
          repository: zenkio/hk-history-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
          ref: ${{ inputs.data_ref || vars.QUEUE_DATA_REF || 'claude/project-thread-0ylpkc' }}
          fetch-depth: 0

      - name: Continue from the results of earlier runs
        working-directory: data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin auto/consolidate-queue >/dev/null; then
            base=$(git rev-parse HEAD)
            git fetch origin auto/consolidate-queue
            git checkout -B auto/consolidate-queue FETCH_HEAD
            git merge --no-edit "$base"
          else
            git checkout -b auto/consolidate-queue
          fi

      - name: Check out research code
        uses: actions/checkout@v7
        with:
          path: _code
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Overlay research code in isolated workspace
        run: |
          set -euo pipefail
          rsync -a --exclude .git --exclude .github --exclude .gitignore \
            --exclude README.md --exclude CLAUDE.md --exclude LICENSE \
            --exclude CODE_OF_CONDUCT.md _code/ data/
          rm -rf _code

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Work through the queue
        working-directory: data
        env:
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          MODEL: ${{ inputs.model || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
        run: |
          set -euo pipefail
          python3 -u scripts/consolidate_queue.py --model "$MODEL" --plan || true

      - name: Save results to the private branch
        if: always()
        working-directory: data
        run: |
          set -euo pipefail
          git add data/consolidated_facts data/consolidated_status data/consolidated_queue.json data/consolidated_usage.json
          if git diff --cached --quiet; then echo "nothing was written"; exit 0; fi
          git commit -m "auto: consolidate queue"
          git push origin auto/consolidate-queue
