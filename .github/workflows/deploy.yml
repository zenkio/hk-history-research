name: Deploy maintenance site

# The public history site is intentionally in maintenance mode. Do not check out or build
# the private history corpus here: every deployment must publish only the claim-free notice.
# Keep the schedule and push trigger so routine deployments cannot restore old history pages.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out site code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build allow-listed maintenance-only output
        run: |
          set -euo pipefail
          python tests/test_prepare_maintenance_site.py
          python scripts/prepare_maintenance_site.py --output public
          python - <<'PY'
          from pathlib import Path
          root = Path("public")
          expected = {"index.html", "robots.txt", "CNAME"}
          actual = {p.name for p in root.iterdir()}
          if actual != expected:
              raise SystemExit(f"Unexpected public output files: {sorted(actual)}")
          html = (root / "index.html").read_text(encoding="utf-8").lower()
          if '<meta name="robots" content="noindex, nofollow">' not in html:
              raise SystemExit("Maintenance page is missing noindex")
          if "sitemap:" in (root / "robots.txt").read_text(encoding="utf-8").lower():
              raise SystemExit("Maintenance robots.txt must not advertise a sitemap")
          print("PASS: deployment artifact contains only maintenance page, robots.txt and CNAME")
          PY

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  pages:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
