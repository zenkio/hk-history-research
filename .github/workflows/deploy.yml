name: Deploy Quartz 5.0 to GitHub Pages

on:
  push:
    branches:
      - main
  # Pushes made by the ingestion bot (GITHUB_TOKEN) never trigger `push`
  # workflows, and ingestion runs hourly, so publish its work every 3 hours.
  schedule:
    - cron: '50 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Quartz Plugins
        run: npm run install-plugins

      - name: Build Quartz Site
        run: npm run quartz -- build

      - name: Disable Jekyll in Public Output
        run: touch public/.nojekyll

      - name: Upload Quartz Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
