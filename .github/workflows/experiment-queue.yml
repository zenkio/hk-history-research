name: Experiment queue

# Starts the next owner-approved experiment (experiments/queue.json in the data repository) when its
# quota fits and no other experiment run is active. Runs daily; GitHub may drop scheduled runs, so a
# manual dispatch does the same. Makes no call itself except the quota check; the job runs as an
# ordinary V2.2 scoring run and writes only to a private experiment branch.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: experiment-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out private research data
        uses: actions/checkout@v7
        with:
          repository: zenkio/hk-history-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
          fetch-depth: 0

      - name: Check out research code
        uses: actions/checkout@v7
        with:
          path: _code
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Overlay research code in isolated workspace
        run: |
          set -euo pipefail
          rsync -a --exclude .git --exclude .github --exclude .gitignore \
            --exclude README.md --exclude CLAUDE.md --exclude LICENSE \
            --exclude CODE_OF_CONDUCT.md _code/ data/
          rm -rf _code

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install research dependencies
        working-directory: data
        run: pip install -r requirements.txt --quiet

      # The scoring and source-first workflows share one concurrency group, so only one runs at a time.
      - name: Is another experiment run active?
        id: busy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          busy=false
          for wf in v2-2-model-scoring.yml v2-1-source-first.yml; do
            for st in queued in_progress; do
              n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --status "$st" --json databaseId --jq length)
              [ "$n" -gt 0 ] && busy=true
            done
          done
          echo "busy=$busy" >> "$GITHUB_OUTPUT"

      - name: Pick the next job that fits the quota
        id: pick
        working-directory: data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPEN_ROUTER_KEY_RESEARCHER: ${{ secrets.OPEN_ROUTER_KEY_RESEARCHER }}
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          BUSY: ${{ steps.busy.outputs.busy }}
        run: |
          set -euo pipefail
          args=()
          [ "$BUSY" = true ] && args+=(--busy)
          python3 -u scripts/experiment_queue.py "${args[@]}"

      - name: Start the job
        if: steps.pick.outputs.job_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.pick.outputs.mode }}
          MODELS: ${{ steps.pick.outputs.models }}
          DOC: ${{ steps.pick.outputs.document }}
          LIMIT: ${{ steps.pick.outputs.limit }}
        run: |
          set -euo pipefail
          args=(-f "mode=$MODE" -f "models=$MODELS" -f "limit=$LIMIT")
          [ -n "$DOC" ] && args+=(-f "document=$DOC")
          gh workflow run v2-2-model-scoring.yml --repo "$GITHUB_REPOSITORY" --ref main "${args[@]}"

      - name: Mark the job dispatched
        if: steps.pick.outputs.job_id != ''
        working-directory: data
        env:
          JOB: ${{ steps.pick.outputs.job_id }}
        run: |
          set -euo pipefail
          python3 -u scripts/experiment_queue.py --mark "$JOB"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add experiments/queue.json
          git commit -m "experiment queue: job $JOB dispatched"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
