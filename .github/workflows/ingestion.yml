name: Automated History Research Ingestion

on:
  schedule:
    # Hourly: Gemini quotas are spent in the first run or two of each day; after
    # that Gemma is limited by tokens/minute, so running more often uses more of it.
    - cron: '5 * * * *'
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

# Never let two runs push at once; a late run queues behind the current one.
concurrency:
  group: ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt --quiet

      - name: Pull latest changes
        run: git pull --rebase origin main

      - name: Fetch new articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/fetch_sources.py

      - name: Repair truncated summaries and thin pages
        run: python3 scripts/repair_content.py --commit

      - name: Process and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/process_ingestion.py

      # Spend the quota RSS did not need on AI-drafted history pages.
      - name: Seed history drafts with leftover quota
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 scripts/seed_history.py --minutes 45
