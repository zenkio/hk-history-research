name: Pipeline

# Runs the research pipeline on the private data repository (zenkio/hk-history-data): fetch RSS,
# repair, classify, then evidence, Wikipedia cross-check, photos and drafting. Every change is
# committed to the data repository, never to this one.
#
# Off unless the repository variable PIPELINE_ON_ACTIONS is "on": the pipeline runs either here or
# on our own machine (Oracle), never both, because both would count the same AI quota and push
# to the same branch. A manual run (Run workflow) always works.
#
# Run logs of a public repository are public, and the pipeline's output names pages, queries and
# grades. So each step writes its output to a file that is saved to the `logs` branch of the data
# repository (last 7 days, one commit, replaced each time); this log only shows which steps ran.

on:
  schedule:
    # Gemma is limited per minute, so every hour not running is capacity lost. GitHub drops most
    # scheduled runs of this repository (on 2026-09-29: 2 of 14 hourly runs, 3 of 5 deploys), so each
    # successful run queues the next one (last step); this schedule only restarts the chain after a
    # failure. Minute 17 keeps clear of the busiest time, the top of the hour.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # only to queue the next run (last step)

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  pipeline:
    if: github.event_name != 'schedule' || vars.PIPELINE_ON_ACTIONS == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out the data repository
        uses: actions/checkout@v7
        with:
          repository: zenkio/hk-history-data
          token: ${{ secrets.DATA_REPO_TOKEN }}  # also lets the scripts push to it
          fetch-depth: 0

      - name: Check out this repository's code
        uses: actions/checkout@v7
        with:
          path: _code

      - name: Put the code over the data
        run: |
          rsync -a --exclude .git --exclude .github --exclude .gitignore --exclude README.md \
            --exclude CLAUDE.md --exclude LICENSE --exclude CODE_OF_CONDUCT.md _code/ ./
          rm -rf _code
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "LOG=$RUNNER_TEMP/$(date -u +%Y-%m-%d)-run-${{ github.run_id }}.log" >> "$GITHUB_ENV"
          echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt --quiet

      - name: Fetch new articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/fetch_sources.py >> "$LOG" 2>&1

      - name: Repair summaries and thin pages
        run: python3 scripts/repair_content.py --commit >> "$LOG" 2>&1

      - name: Label legacy AI drafts in private content
        run: python3 scripts/label_legacy_ai_drafts.py --write

      - name: Classify and publish
        id: classify
        timeout-minutes: 25
        continue-on-error: true  # run evidence/research even if classification fails; the failure is surfaced below
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPEN_ROUTER_KEY_RESEARCHER: ${{ secrets.OPEN_ROUTER_KEY_RESEARCHER }}
        run: python3 scripts/process_ingestion.py >> "$LOG" 2>&1

      - name: Evidence, cross-check, photos and drafting
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPEN_ROUTER_KEY_RESEARCHER: ${{ secrets.OPEN_ROUTER_KEY_RESEARCHER }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          FREEJEV_API_KEY: ${{ secrets.FREEJEV_API_KEY }}
        run: python3 scripts/seed_history.py --minutes 45 >> "$LOG" 2>&1

      # continue-on-error lets evidence research run after a classification error, but it must not
      # make the whole workflow green. Fail only after the diagnostic log has been written by the
      # always() step below; this also prevents Queue the next run from treating a partial run as success.
      - name: Fail run if classification failed
        if: steps.classify.outcome == 'failure'
        run: |
          echo "CLASSIFICATION_FAILURE: classify/publish failed. The source should remain queued; see the preceding log entries." | tee -a "$LOG"
          exit 1

      - name: Save the log to the data repository (branch logs)
        if: always()
        run: bash scripts/save_log.sh "$LOG"

      # Scheduled runs are unreliable here, so the pipeline keeps itself going: a successful run
      # queues the next (the concurrency group makes it wait). Only while switched on; a failed run
      # ends the chain, and the schedule starts it again. GITHUB_TOKEN may start workflow_dispatch.
      # Only a busy run (20+ minutes) queues the next: an idle one takes 2 minutes, and queueing
      # after it started 317 runs on 2026-09-30. With nothing to do, the hourly schedule is enough.
      - name: Queue the next run
        if: success() && vars.PIPELINE_ON_ACTIONS == 'on'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          minutes=$(( ($(date +%s) - RUN_STARTED) / 60 ))
          if [ "$minutes" -lt 20 ]; then
            echo "This run took $minutes minutes, so there was little to do: the next run waits for the schedule."
          else
            gh workflow run ingestion.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi

      - name: Where to read the details
        if: failure()
        run: echo "A step failed. The full output is on the logs branch of hk-history-data."
