name: Pipeline

# Runs the research pipeline on the private data repository (zenkio/hk-history-data): fetch RSS,
# repair, classify, then evidence, Wikipedia cross-check, photos and drafting. Every change is
# committed to the data repository, never to this one.
#
# Run daily at 03:17 UTC (away from the top of the hour) and allow manual runs. There is deliberately
# no self-queuing: one bounded run per day avoids an accidental chain of long-running jobs.
#
# Run logs of a public repository are public, and the pipeline's output names pages, queries and
# grades. Script output is redirected to a log saved only on the private data repository's logs
# branch; workflow console output should remain non-sensitive.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out the data repository
        uses: actions/checkout@v7
        with:
          repository: zenkio/hk-history-data
          token: ${{ secrets.DATA_REPO_TOKEN }}  # fine-grained token, restricted to the private data repo
          fetch-depth: 0

      - name: Check out this repository's code
        uses: actions/checkout@v7
        with:
          path: _code
          persist-credentials: false

      - name: Put the code over the data
        run: |
          rsync -a --exclude .git --exclude .github --exclude .gitignore --exclude README.md \\
            --exclude CLAUDE.md --exclude LICENSE --exclude CODE_OF_CONDUCT.md _code/ ./
          rm -rf _code
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "LOG=$RUNNER_TEMP/$(date -u +%Y-%m-%d)-run-${{ github.run_id }}.log" >> "$GITHUB_ENV"
          echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt --quiet

      - name: Fetch new articles
        id: fetch_sources
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/fetch_sources.py >> "$LOG" 2>&1

      - name: Repair summaries and thin pages
        id: repair
        run: python3 scripts/repair_content.py --commit >> "$LOG" 2>&1

      - name: Label legacy AI drafts in private content
        id: label_drafts
        run: python3 scripts/label_legacy_ai_drafts.py --write --quiet >> "$LOG" 2>&1

      - name: Classify and publish
        id: classify
        timeout-minutes: 25
        continue-on-error: true  # run evidence/research even if classification fails; failure is surfaced below
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPEN_ROUTER_KEY_RESEARCHER: ${{ secrets.OPEN_ROUTER_KEY_RESEARCHER }}
        run: python3 scripts/process_ingestion.py >> "$LOG" 2>&1

      - name: Evidence, cross-check, photos and drafting
        id: seed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPEN_ROUTER_KEY_RESEARCHER: ${{ secrets.OPEN_ROUTER_KEY_RESEARCHER }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          FREEJEV_API_KEY: ${{ secrets.FREEJEV_API_KEY }}
        run: python3 scripts/seed_history.py --minutes 45 >> "$LOG" 2>&1

      # Continue-on-error lets evidence research run after classification errors, but the overall
      # run must still fail so the issue is visible in Actions.
      - name: Fail run if classification failed
        if: steps.classify.outcome == 'failure'
        run: |
          echo "CLASSIFICATION_FAILURE: classify/publish failed. The source should remain queued; see the private diagnostic log." | tee -a "$LOG"
          exit 1

      - name: Save the log to the data repository (branch logs)
        id: save_log
        if: always()
        run: bash scripts/save_log.sh "$LOG"

      # Do not leave last_run.status as success when any earlier stage failed.
      - name: Record partial-failure state
        if: failure()
        env:
          PIPELINE_OUTCOMES: fetch_sources=${{ steps.fetch_sources.outcome }},repair=${{ steps.repair.outcome }},label_drafts=${{ steps.label_drafts.outcome }},classify=${{ steps.classify.outcome }},seed=${{ steps.seed.outcome }},save_log=${{ steps.save_log.outcome }}
        run: |
          python3 scripts/mark_pipeline_failure.py --outcomes "$PIPELINE_OUTCOMES"
          git add -- scripts/seed_plan.json
          if ! git diff --cached --quiet; then
            git commit -m "auto(pipeline): record partial failure"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Where to read the details
        if: failure()
        run: echo "A step failed. The full output is on the logs branch of hk-history-data."
