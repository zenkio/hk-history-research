name: One-off evidence-first extraction pilot

# Intentionally limited to this temporary experiment branch. Outputs contain excerpts from
# private draft pages, so they are committed only to a private data-repository experiment branch.
# Do not merge this workflow into main.
on:
  push:
    branches:
      - experiment/run-live-preflight-v2-20261010

permissions:
  contents: read

concurrency:
  group: evidence-first-live-preflight-v2
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research code
        uses: actions/checkout@v7
        with:
          path: _code
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: _code/requirements.txt

      - name: Install dependencies
        run: pip install -r _code/requirements.txt --quiet

      - name: Check out private data experiment branch
        uses: actions/checkout@v7
        with:
          repository: zenkio/hk-history-data
          ref: experiment/preflight-model-output-v2-20261010
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
          fetch-depth: 0

      - name: Run the configured extractor on four reference pages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPEN_ROUTER_KEY_RESEARCHER: ${{ secrets.OPEN_ROUTER_KEY_RESEARCHER }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/preflight"
          mkdir -p "$OUT"
          failures=()
          run_page() {
            name="$1"
            page="$2"
            if python _code/scripts/extract_atomic_claims.py "data/content/01_Timeline/$page" \
              --timeline-root data/content/01_Timeline --output "$OUT/$name.jsonl" \
              2>"$OUT/$name.stderr"; then
              echo "PAGE_RESULT $name=success"
            else
              rc=$?
              failures+=("$name:$rc")
              echo "PAGE_RESULT $name=failed exit=$rc"
            fi
          }
          run_page mpf "13-transition/1987-implementation-of-the-mandatory-provident-fund-planning.md"
          run_page tatsu-maru "08-new-territories/1908-the-tatsu-maru-boycott-and-anti-japanese-movement.md"
          run_page occupation-1841 "05-opium-war/1841-formal-british-possession-of-hong-kong-island.md"
          run_page yeung-ku-wan "08-new-territories/1901-assassination-of-yeung-ku-wan.md"
          python - "$OUT" "${failures[@]}" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          out = Path(sys.argv[1])
          failed = {}
          for item in sys.argv[2:]:
              name, _, code = item.partition(":")
              failed[name] = int(code or "1")
          manifest = {
              "experiment": "evidence-first-preflight",
              "files": [],
              "failures": failed,
          }
          for name in ("mpf", "tatsu-maru", "occupation-1841", "yeung-ku-wan"):
              path = out / f"{name}.jsonl"
              if not path.exists():
                  manifest["files"].append({
                      "file": path.name,
                      "status": "failed",
                      "exit_code": failed.get(name),
                  })
                  continue
              raw = path.read_bytes()
              rows = [json.loads(line) for line in raw.decode("utf-8").splitlines() if line.strip()]
              manifest["files"].append({
                  "file": path.name,
                  "status": "success",
                  "claim_count": len(rows),
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "models": sorted({row.get("provenance", {}).get("model", "") for row in rows if row.get("provenance", {}).get("model")}),
                  "prompt_versions": sorted({row.get("provenance", {}).get("prompt_version", "") for row in rows if row.get("provenance", {}).get("prompt_version")}),
              })
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print("PREFLIGHT_SUMMARY " + json.dumps({
              "successful_pages": sum(1 for item in manifest["files"] if item["status"] == "success"),
              "failed_pages": len(failed),
              "claim_counts": {item["file"]: item.get("claim_count", 0) for item in manifest["files"]},
          }, sort_keys=True))
          PY

      - name: Save outputs to private experiment branch only
        env:
          OUT: ${{ runner.temp }}/preflight
        run: |
          set -euo pipefail
          DEST="data/experiments/model-output/2026-10-10/prompt-v2"
          mkdir -p "$DEST"
          shopt -s nullglob
          files=("$OUT"/*.jsonl "$OUT"/*.stderr "$OUT"/manifest.json)
          if (("${#files[@]}" == 0)); then
            echo "No preflight outputs to save"
            exit 1
          fi
          cp "${files[@]}" "$DEST"/
          git -C data config user.name "github-actions[bot]"
          git -C data config user.email "github-actions[bot]@users.noreply.github.com"
          git -C data add "experiments/model-output/2026-10-10/prompt-v2"
          git -C data diff --cached --check
          git -C data commit -m "experiment: save isolated preflight model outputs"
          git -C data push origin HEAD:experiment/preflight-model-output-v2-20261010

      - name: Fail if any reference-page extraction failed
        env:
          MANIFEST: ${{ runner.temp }}/preflight/manifest.json
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          with open(os.environ["MANIFEST"], encoding="utf-8") as handle:
              manifest = json.load(handle)
          failures = manifest.get("failures", {})
          if failures:
              print("Preflight extraction failures:", ", ".join(sorted(failures)))
              sys.exit(1)
          print("PASS | all four reference-page extractions completed")
          PY
