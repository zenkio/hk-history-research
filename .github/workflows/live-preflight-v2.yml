name: One-off evidence-first extraction pilot

# Intentionally limited to this temporary experiment branch. Outputs contain excerpts from
# private draft pages, so they are committed only to a private data-repository experiment branch.
# Do not merge this workflow into main.
on:
  push:
    branches:
      - experiment/run-live-preflight-v2-20261010

permissions:
  contents: read

concurrency:
  group: evidence-first-live-preflight-v2
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research code
        uses: actions/checkout@v7
        with:
          path: _code
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: _code/requirements.txt

      - name: Install dependencies
        run: pip install -r _code/requirements.txt pytest --quiet

      - name: Run focused preflight unit tests
        run: |
          set -euo pipefail
          pytest -q _code/tests/test_validate_preflight_outputs.py _code/tests/test_extract_atomic_claims.py

      - name: Check out private data experiment branch
        uses: actions/checkout@v7
        with:
          repository: zenkio/hk-history-data
          ref: experiment/preflight-model-output-v3-20261010
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
          fetch-depth: 0

      - name: Run the configured extractor on four reference pages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPEN_ROUTER_KEY_RESEARCHER: ${{ secrets.OPEN_ROUTER_KEY_RESEARCHER }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/preflight"
          mkdir -p "$OUT"
          failures=()
          run_page() {
            name="$1"
            page="$2"
            if python _code/scripts/extract_atomic_claims.py "data/content/01_Timeline/$page" \
              --timeline-root data/content/01_Timeline --output "$OUT/$name.jsonl" \
              2>"$OUT/$name.stderr"; then
              echo "PAGE_RESULT $name=success"
            else
              rc=$?
              failures+=("$name:$rc")
              echo "PAGE_RESULT $name=failed exit=$rc"
            fi
          }
          run_page mpf "13-transition/1987-implementation-of-the-mandatory-provident-fund-planning.md"
          run_page tatsu-maru "08-new-territories/1908-the-tatsu-maru-boycott-and-anti-japanese-movement.md"
          run_page occupation-1841 "05-opium-war/1841-formal-british-possession-of-hong-kong-island.md"
          run_page yeung-ku-wan "08-new-territories/1901-assassination-of-yeung-ku-wan.md"
          # Validate every output and write a manifest even when extraction failed.
          # Keep the job alive long enough to commit diagnostic artefacts privately.
          if python _code/scripts/validate_preflight_outputs.py "$OUT"; then
            echo "PREFLIGHT_VALIDATION completed"
          else
            echo "PREFLIGHT_VALIDATION has failures; outputs will be saved privately before the job fails"
          fi

      - name: Save outputs to private experiment branch only
        env:
          OUT: ${{ runner.temp }}/preflight
        run: |
          set -euo pipefail
          DEST="data/experiments/model-output/2026-10-10/prompt-v3"
          mkdir -p "$DEST"
          shopt -s nullglob
          files=("$OUT"/*.jsonl "$OUT"/*.stderr "$OUT"/manifest.json)
          if (("${#files[@]}" == 0)); then
            echo "No preflight outputs to save"
            exit 1
          fi
          cp "${files[@]}" "$DEST"/
          git -C data config user.name "github-actions[bot]"
          git -C data config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git -C data status --porcelain -- content/01_Timeline research/records)" ]]; then
            echo "Live timeline/research records changed during the experiment; refusing to commit"
            git -C data status --short -- content/01_Timeline research/records
            exit 1
          fi
          git -C data add "experiments/model-output/2026-10-10/prompt-v3"
          unexpected="$(git -C data diff --cached --name-only | grep -v '^experiments/model-output/2026-10-10/prompt-v3/' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected staged paths; refusing to commit"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git -C data diff --cached --check
          git -C data commit -m "experiment: save isolated preflight prompt-v3 outputs"
          git -C data push origin HEAD:experiment/preflight-model-output-v3-20261010

      - name: Fail if any reference-page extraction failed
        env:
          MANIFEST: ${{ runner.temp }}/preflight/manifest.json
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          with open(os.environ["MANIFEST"], encoding="utf-8") as handle:
              manifest = json.load(handle)
          failures = manifest.get("failures", {})
          if len(manifest.get("files", [])) != 4:
              print("FAIL | manifest must contain exactly four reference pages")
              sys.exit(1)
          if failures:
              print("FAIL | preflight acceptance checks failed:")
              for filename, reason in sorted(failures.items()):
                  print(f"  {filename}: {reason}")
              sys.exit(1)
          acceptance = manifest.get("acceptance", {})
          if acceptance.get("live_records_modified") is not False:
              print("FAIL | isolation assertion missing or unsafe")
              sys.exit(1)
          if acceptance.get("bulk_extraction_approved") is not False or acceptance.get("publication_approved") is not False:
              print("FAIL | preflight must never approve bulk extraction or publication")
              sys.exit(1)
          print("PASS | all four reference pages have non-empty valid unverified records within the claim-length threshold")
          PY
