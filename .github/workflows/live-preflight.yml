name: One-off evidence-first extraction pilot

# Intentionally limited to this temporary experiment branch. Outputs contain excerpts from
# private draft pages, so they are committed only to a private data-repository experiment branch.
# Do not merge this workflow into main.
on:
  push:
    branches:
      - experiment/run-live-preflight-20261010

permissions:
  contents: read

concurrency:
  group: evidence-first-live-preflight
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research code
        uses: actions/checkout@v7
        with:
          path: _code
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: _code/requirements.txt

      - name: Install dependencies
        run: pip install -r _code/requirements.txt --quiet

      - name: Check out private data experiment branch
        uses: actions/checkout@v7
        with:
          repository: zenkio/hk-history-data
          ref: experiment/preflight-model-output-20261010
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
          fetch-depth: 0

      - name: Run the configured extractor on four reference pages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPEN_ROUTER_KEY_RESEARCHER: ${{ secrets.OPEN_ROUTER_KEY_RESEARCHER }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/preflight"
          mkdir -p "$OUT"
          python _code/scripts/extract_atomic_claims.py \
            data/content/01_Timeline/13-transition/1987-implementation-of-the-mandatory-provident-fund-planning.md \
            --timeline-root data/content/01_Timeline --output "$OUT/mpf.jsonl"
          python _code/scripts/extract_atomic_claims.py \
            data/content/01_Timeline/08-new-territories/1908-the-tatsu-maru-boycott-and-anti-japanese-movement.md \
            --timeline-root data/content/01_Timeline --output "$OUT/tatsu-maru.jsonl"
          python _code/scripts/extract_atomic_claims.py \
            data/content/01_Timeline/05-opium-war/1841-formal-british-possession-of-hong-kong-island.md \
            --timeline-root data/content/01_Timeline --output "$OUT/occupation-1841.jsonl"
          python _code/scripts/extract_atomic_claims.py \
            data/content/01_Timeline/08-new-territories/1901-assassination-of-yeung-ku-wan.md \
            --timeline-root data/content/01_Timeline --output "$OUT/yeung-ku-wan.jsonl"
          python - "$OUT" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          out = Path(sys.argv[1])
          manifest = {"experiment": "evidence-first-preflight", "files": []}
          for name in ("mpf", "tatsu-maru", "occupation-1841", "yeung-ku-wan"):
              path = out / f"{name}.jsonl"
              raw = path.read_bytes()
              rows = [json.loads(line) for line in raw.decode("utf-8").splitlines() if line.strip()]
              manifest["files"].append({
                  "file": path.name,
                  "claim_count": len(rows),
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "models": sorted({row.get("provenance", {}).get("model", "") for row in rows if row.get("provenance", {}).get("model")}),
                  "prompt_versions": sorted({row.get("provenance", {}).get("prompt_version", "") for row in rows if row.get("provenance", {}).get("prompt_version")}),
              })
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print("PASS | four private reference-page extractions completed; only counts, model/prompt versions and hashes will be logged")
          for item in manifest["files"]:
              print(f"  {item['file']}: claims={item['claim_count']}; sha256={item['sha256'][:12]}; models={','.join(item['models']) or 'none'}")
          PY

      - name: Save outputs to private experiment branch only
        env:
          OUT: ${{ runner.temp }}/preflight
        run: |
          set -euo pipefail
          DEST="data/experiments/model-output/2026-10-10"
          mkdir -p "$DEST"
          cp "$OUT"/*.jsonl "$OUT"/manifest.json "$DEST"/
          git -C data config user.name "github-actions[bot]"
          git -C data config user.email "github-actions[bot]@users.noreply.github.com"
          git -C data add "experiments/model-output/2026-10-10"
          git -C data diff --cached --check
          git -C data commit -m "experiment: save isolated preflight model outputs"
          git -C data push origin HEAD:experiment/preflight-model-output-20261010
