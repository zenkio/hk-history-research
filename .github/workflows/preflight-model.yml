name: Configured-model preflight

# This experiment runs only on explicit dispatch or a dedicated trigger branch.
# Its claim output is committed to a branch in the PRIVATE data repository; never upload it
# as an artifact from this public repository.
on:
  workflow_dispatch:
  push:
    branches:
      - 'preflight-run/**'

permissions:
  contents: read

concurrency:
  group: configured-model-preflight
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out private research data
        uses: actions/checkout@v7
        with:
          repository: zenkio/hk-history-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
          fetch-depth: 0

      - name: Check out research code
        uses: actions/checkout@v7
        with:
          path: _code
          persist-credentials: false

      - name: Overlay code in the isolated checkout
        run: |
          rsync -a --exclude .git --exclude .github --exclude .gitignore \
            --exclude README.md --exclude CLAUDE.md --exclude LICENSE \
            --exclude CODE_OF_CONDUCT.md _code/ data/
          rm -rf _code

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install research dependencies
        working-directory: data
        run: pip install -r requirements.txt -r requirements-dev.txt --quiet

      # Capture all model output and diagnostics privately. Public logs contain only sample indexes
      # and aggregate counts, never claim text, excerpts, source page names, or prompts.
      - name: Run configured extraction model on four reference pages
        working-directory: data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPEN_ROUTER_KEY_RESEARCHER: ${{ secrets.OPEN_ROUTER_KEY_RESEARCHER }}
          PRIVATE_OUTPUT: ${{ runner.temp }}/preflight-model-output
          PRIVATE_LOG: ${{ runner.temp }}/preflight-model.log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PRIVATE_OUTPUT"
          : > "$PRIVATE_LOG"
          pages=(
            "content/01_Timeline/13-transition/1987-implementation-of-the-mandatory-provident-fund-planning.md"
            "content/01_Timeline/08-new-territories/1908-the-tatsu-maru-boycott-and-anti-japanese-movement.md"
            "content/01_Timeline/05-opium-war/1841-formal-british-possession-of-hong-kong-island.md"
            "content/01_Timeline/08-new-territories/1901-assassination-of-yeung-ku-wan.md"
          )
          for i in "${!pages[@]}"; do
            sample=$(printf 'sample-%02d' "$((i + 1))")
            if ! python3 scripts/extract_atomic_claims.py "${pages[$i]}" \
              --output "$PRIVATE_OUTPUT/$sample.jsonl" >>"$PRIVATE_LOG" 2>&1; then
              echo "FAIL | configured-model extraction | sample=$sample; diagnostics withheld from public logs"
              exit 1
            fi
          done
          python3 - "$PRIVATE_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          summary = []
          for index in range(1, 5):
              path = root / f"sample-{index:02d}.jsonl"
              rows = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
              if not rows:
                  raise SystemExit(f"FAIL | empty output | sample-{index:02d}")
              if any(row.get("status") != "unverified" for row in rows):
                  raise SystemExit(f"FAIL | non-unverified output | sample-{index:02d}")
              if any(not row.get("provenance", {}).get("source_excerpt") for row in rows):
                  raise SystemExit(f"FAIL | missing excerpt provenance | sample-{index:02d}")
              models = sorted({row.get("provenance", {}).get("model", "unknown") for row in rows})
              prompts = sorted({row.get("provenance", {}).get("prompt_version", "unknown") for row in rows})
              summary.append({
                  "sample": f"sample-{index:02d}",
                  "claim_count": len(rows),
                  "models": models,
                  "prompt_versions": prompts,
                  "all_unverified": True,
                  "all_have_source_excerpt": True,
              })
          (root / "summary.json").write_text(
              json.dumps({
                  "purpose": "isolated configured-model preflight; not a corpus migration",
                  "run_id": __import__("os").environ["GITHUB_RUN_ID"],
                  "code_commit": __import__("os").environ["GITHUB_SHA"],
                  "samples": summary,
                  "live_records_changed": False,
                  "publication_state_changed": False,
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          print("PASS | configured-model extraction | samples=4; outputs=private; all records unverified")
          print("Claim counts:", ",".join(str(row["claim_count"]) for row in summary))
          PY

      # Keep the exact JSONL and run summary in a private experiment branch, not public artifacts.
      - name: Save outputs to private experiment branch
        working-directory: data
        env:
          PRIVATE_OUTPUT: ${{ runner.temp }}/preflight-model-output
          PRIVATE_BRANCH: experiment/preflight-model-${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$PRIVATE_BRANCH"
          mkdir -p "experiments/model-runs/${GITHUB_RUN_ID}"
          cp "$PRIVATE_OUTPUT"/*.jsonl "$PRIVATE_OUTPUT/summary.json" "experiments/model-runs/${GITHUB_RUN_ID}/"
          git add "experiments/model-runs/${GITHUB_RUN_ID}"
          git commit -m "experiment: save isolated extraction preflight output"
          git push origin "$PRIVATE_BRANCH"
          echo "PASS | private experiment output saved | run=${GITHUB_RUN_ID}; branch=$PRIVATE_BRANCH"
