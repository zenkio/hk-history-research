name: Maintenance site check

# Validate the maintenance-only artifact without checking out or building private history data.
on:
  pull_request:
    paths:
      - ".github/workflows/deploy.yml"
      - ".github/workflows/site-build.yml"
      - "scripts/prepare_maintenance_site.py"
      - "site/maintenance.html"
      - "site/robots.txt"
      - "site/CNAME"
      - "tests/test_prepare_maintenance_site.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance-output:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run maintenance output regression tests
        run: python tests/test_prepare_maintenance_site.py

      - name: Verify generated output is allow-listed
        run: |
          set -euo pipefail
          python scripts/prepare_maintenance_site.py --output public
          python - <<'PY'
          from pathlib import Path
          root = Path("public")
          expected = {"index.html", "robots.txt", "CNAME"}
          actual = {p.name for p in root.iterdir()}
          assert actual == expected, f"Unexpected files: {sorted(actual)}"
          html = (root / "index.html").read_text(encoding="utf-8").lower()
          assert '<meta name="robots" content="noindex, nofollow">' in html
          assert "sitemap:" not in (root / "robots.txt").read_text(encoding="utf-8").lower()
          print("PASS: maintenance-only output is safe")
          PY
