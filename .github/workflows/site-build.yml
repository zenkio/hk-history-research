name: Preview site check

# Validate the draft-preview helpers without checking out or building private history data.
on:
  pull_request:
    paths:
      - ".github/workflows/deploy.yml"
      - ".github/workflows/site-build.yml"
      - "scripts/preview_noindex.py"
      - "scripts/prepare_maintenance_site.py"
      - "tests/test_preview_noindex.py"
      - "tests/test_prepare_maintenance_site.py"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run the preview and maintenance output tests
        run: |
          python -m pip install --quiet pytest
          python tests/test_prepare_maintenance_site.py
          python -m pytest tests/test_preview_noindex.py -q
