name: Source connectivity probes

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "17 8 1 * *"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe public source endpoints
        run: python3 scripts/check_source_connectivity.py --strict
