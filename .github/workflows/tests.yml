name: Tests

# The pipeline's unit and integration tests (offline, with fakes) plus the checks that read every
# real page, run on the private content from zenkio/hk-history-data. Test output only names files
# that fail a check.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the data repository
        uses: actions/checkout@v7
        with:
          repository: zenkio/hk-history-data
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - name: Check out this repository's code
        uses: actions/checkout@v7
        with:
          path: _code

      # Catches workflow mistakes tests can't: bad expressions, invalid variable names.
      - name: Lint workflows
        run: |
          pip install --quiet "actionlint-py>=1.7"
          actionlint _code/.github/workflows/*.yml

      # Unlike the pipeline, this job never commits, so the code's .gitignore comes too (a test reads it).
      - name: Put the code over the data
        run: |
          rsync -a --exclude .git --exclude README.md \
            --exclude CLAUDE.md --exclude LICENSE --exclude CODE_OF_CONDUCT.md _code/ ./
          rm -rf _code

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt --quiet

      - name: Every script compiles
        run: python -m py_compile scripts/*.py

      - name: Run tests
        run: python -m pytest tests -q

      # Apply only draft metadata/warnings in this ephemeral CI checkout; narratives and sources are untouched.
      - name: Label legacy AI drafts in CI workspace
        run: python3 scripts/label_legacy_ai_drafts.py --write --quiet

      # Exercise the exact publication gate used by deployment against the real private corpus.
      - name: Validate publication eligibility against private corpus
        run: python3 scripts/publication_gate.py

      # Read the real private corpus but never write migrated records in CI.
      - name: Preview claim-record migration against private corpus
        run: python3 scripts/migrate_claim_records.py

      # Run the real-corpus preview in the runner's temporary directory. Only summary
      # counts/status are logged; the private claim text and excerpts are not printed.
      - name: Run isolated real-page narrative preview
        env:
          PREVIEW_PATH: ${{ runner.temp }}/white-paper-preview.md
        run: |
          python3 scripts/reconstruct_narrative.py \
            --event-id event:15-contention-2014-beijing-issues-white-paper-on-hong-kong \
            --output "$PREVIEW_PATH"
          python3 - "$PREVIEW_PATH" <<'PY'
          import re
          import sys
          from pathlib import Path

          preview = Path(sys.argv[1]).read_text(encoding="utf-8")
          included = re.search(r"Supported claims included: (\d+)", preview)
          unresolved = re.search(r"Unresolved core claims: (\d+)", preview)
          assert "RESEARCH PREVIEW — NOT PUBLISHED" in preview
          assert "Core evidence gate: NOT PASSED" in preview
          assert "claim:15-contention-2014-beijing-issues-white-paper-on-hong-kong-067e6e9272" in preview
          assert included and included.group(1) == "3", "expected three claims with current inspectable supporting evidence"
          assert unresolved and unresolved.group(1) == "1", "the unsupported judges claim must remain unresolved"
          print(f"PASS | real-page preview | included={included.group(1)}; unresolved_core={unresolved.group(1)}; gate=NOT PASSED; preview only")
          PY

      - name: Report research coverage health (read-only)
        run: python3 scripts/research_health.py

      - name: Build prioritised claim queue (read-only)
        env:
          QUEUE_PATH: ${{ runner.temp }}/research-queue.jsonl
        run: python3 scripts/research_queue.py --limit 100 --output "$QUEUE_PATH"
