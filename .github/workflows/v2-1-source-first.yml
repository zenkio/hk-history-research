name: V2.1 source-first model experiment

# Explicit dispatch only. The workflow must never run as part of the scheduled research pipeline.
# Source packets must have inspected passages and processing_status=approved_for_internal_research.
# All generated content and diagnostics are saved only to a private experiment branch.
on:
  workflow_dispatch:
    inputs:
      packet_dir:
        description: Private source-packet directory relative to the data repository
        required: true
        type: string
        default: experiments/v2-1/source-packets
      max_packets:
        description: Maximum number of approved packets to process (1-4)
        required: true
        type: number
        default: 4
      model_role:
        description: Model routing (evidence = Nemotron first; source_first_compare = one model of another family)
        required: true
        type: choice
        options: [evidence, source_first_compare]
        default: evidence

permissions:
  contents: read

concurrency:
  group: source-first-v2-1
  cancel-in-progress: false

jobs:
  source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out private research data
        uses: actions/checkout@v7
        with:
          repository: zenkio/hk-history-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
          fetch-depth: 0

      - name: Check out research code
        uses: actions/checkout@v7
        with:
          path: _code
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Overlay research code in isolated workspace
        run: |
          set -euo pipefail
          rsync -a --exclude .git --exclude .github --exclude .gitignore \
            --exclude README.md --exclude CLAUDE.md --exclude LICENSE \
            --exclude CODE_OF_CONDUCT.md _code/ data/
          rm -rf _code

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install research dependencies
        working-directory: data
        run: pip install -r requirements.txt -r requirements-dev.txt --quiet

      # Keep all source text, prompts, model responses and error detail private.
      - name: Run approved source-first packets
        working-directory: data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPEN_ROUTER_KEY_RESEARCHER: ${{ secrets.OPEN_ROUTER_KEY_RESEARCHER }}
          PACKET_DIR: ${{ inputs.packet_dir }}
          MAX_PACKETS: ${{ inputs.max_packets }}
          MODEL_ROLE: ${{ inputs.model_role }}
          PRIVATE_OUTPUT: ${{ runner.temp }}/v2-1-output
          PRIVATE_LOG: ${{ runner.temp }}/v2-1-diagnostics.log
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$PRIVATE_OUTPUT"
          : > "$PRIVATE_LOG"
          failed=0
          # workflow_dispatch number inputs can arrive as "4.0"; normalise
          # only integral values in the allowed range before Bash arithmetic.
          raw_max_packets="${MAX_PACKETS:-4}"
          if [[ "$raw_max_packets" =~ ^([1-4])(\.0+)?$ ]]; then
            MAX_PACKETS="${BASH_REMATCH[1]}"
          else
            echo "max_packets must be an integer between 1 and 4" >> "$PRIVATE_LOG"
            failed=1
            MAX_PACKETS=0
          fi
          packet_root="$PACKET_DIR"
          if (( failed != 0 )); then
            :
          elif [[ ! -d "$packet_root" ]]; then
            echo "packet directory not found: $packet_root" >> "$PRIVATE_LOG"
            failed=1
          else
            # MANIFEST.json describes the packet set; it is not itself a source packet.
            # Never treat every JSON file in a directory as a data record.
            mapfile -t packets < <(find "$packet_root" -maxdepth 1 -type f -name '*.json' ! -name 'MANIFEST.json' | sort)
            if (( ${#packets[@]} == 0 )); then
              echo "no eligible JSON source packets found: $packet_root" >> "$PRIVATE_LOG"
              failed=1
            elif (( MAX_PACKETS < 1 || MAX_PACKETS > 4 )); then
              echo "max_packets must be between 1 and 4" >> "$PRIVATE_LOG"
              failed=1
            else
              if (( ${#packets[@]} > MAX_PACKETS )); then
                packets=("${packets[@]:0:MAX_PACKETS}")
              fi
              index=0
              for packet in "${packets[@]}"; do
                index=$((index + 1))
                # Name each output after its packet so a sample can be traced without guessing.
                name=$(basename "$packet" .json)
                sample=$(printf 'sample-%02d-%s' "$index" "$name")
                echo "== $sample" >>"$PRIVATE_LOG"
                if ! python3 scripts/source_first_experiment.py "$packet" \
                  --role "$MODEL_ROLE" --output "$PRIVATE_OUTPUT/$sample.json" >>"$PRIVATE_LOG" 2>&1; then
                  echo "FAIL | source-first packet | sample=$sample; details withheld" 
                  failed=1
                  break
                fi
              done
              # E3: hash each source page as fetched now (pages are not saved). A page the
              # runner cannot reach is recorded as an access failure and does not fail the run.
              echo "== snapshots" >>"$PRIVATE_LOG"
              python3 scripts/source_snapshot.py "${packets[@]}" \
                --output "$PRIVATE_OUTPUT/snapshots.json" >>"$PRIVATE_LOG" 2>&1 \
                || echo "snapshot step failed; details in private diagnostics" >>"$PRIVATE_LOG"
            fi
          fi
          python3 - "$PRIVATE_OUTPUT" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$failed" "$MODEL_ROLE" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          run_id, code_sha, failed, role = sys.argv[2], sys.argv[3], sys.argv[4] == "1", sys.argv[5]
          rows = []
          for path in sorted(root.glob("sample-*.json")):
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
                  manifest = value.get("manifest", {})
                  rows.append({
                      "sample": path.stem,
                      "packet_file": manifest.get("packet_file"),
                      "packet_git_blob_sha": manifest.get("packet_git_blob_sha"),
                      "model_api_id": manifest.get("model_api_id"),
                      "rejected_claim_count": manifest.get("rejected_claim_count"),
                      "rejected_perspective_count": manifest.get("rejected_perspective_count"),
                      "rejected_gap_count": manifest.get("rejected_gap_count"),
                      "source_count": value.get("manifest", {}).get("source_count"),
                      "statement_count": value.get("manifest", {}).get("statement_count"),
                      "candidate_claim_count": value.get("manifest", {}).get("candidate_claim_count"),
                      "perspective_count": value.get("manifest", {}).get("perspective_count"),
                      "all_unverified": value.get("manifest", {}).get("status") == "unverified",
                  })
              except Exception:
                  rows.append({"sample": path.stem, "output_parse_failed": True})
                  failed = True
          (root / "summary.json").write_text(json.dumps({
              "purpose": "isolated v2.1 source-first experiment; not a corpus migration",
              "run_id": run_id,
              "code_commit": code_sha,
              "prompt_version": "2.1",
              "prompt_revision": 14,
              "model_role": role,
              "snapshots_saved": (root / "snapshots.json").exists(),
              "status": "failed" if failed else "completed_unverified",
              "samples": rows,
              "live_records_modified": False,
              "bulk_extraction_approved": False,
              "publication_approved": False,
          }, indent=2) + "\n", encoding="utf-8")
          print(f"V2.1 summary | status={'failed' if failed else 'completed_unverified'} | samples={len(rows)} | private output")
          PY
          cp "$PRIVATE_LOG" "$PRIVATE_OUTPUT/diagnostics.log"
          exit "$failed"

      - name: Save output and diagnostics to private experiment branch
        if: always()
        working-directory: data
        env:
          PRIVATE_OUTPUT: ${{ runner.temp }}/v2-1-output
          PRIVATE_BRANCH: experiment/v2-1-model-output-${{ github.run_id }}
        run: |
          set -euo pipefail
          test -d "$PRIVATE_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$PRIVATE_BRANCH"
          target="experiments/v2-1/model-runs/${GITHUB_RUN_ID}"
          mkdir -p "$target"
          cp "$PRIVATE_OUTPUT"/* "$target/"
          git add "$target"
          git commit -m "experiment: save isolated v2.1 source-first output"
          git push origin "$PRIVATE_BRANCH"
          echo "Private v2.1 output saved to $PRIVATE_BRANCH"
