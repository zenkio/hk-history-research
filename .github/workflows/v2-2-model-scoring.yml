name: V2.2 model scoring on the answer key

# Explicit dispatch only; never part of the scheduled pipeline. mode=score: each listed model
# answers the single V2.2 questions for every sentence of the private answer key and is scored step
# by step. mode=extract: the first listed model extracts and links facts from the approved packets.
# mode=links: each listed model links the answer key's facts and is scored on the private link key.
# mode=verify: extract as above, then search archives for records from other institutions about
# facts only one source states; the candidates are saved for review, never added to the packets.
# With records_run, verify reuses that run's saved extraction (runs 10-12 stopped on 504s from the
# extraction model before the search began).
# Sentences, answers and scores are saved only to a private experiment branch of the data repository.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: score = models against the answer key; extract = end to end on the packets with the first model; links = linking against the link key; verify = extract, then find independent records
        required: true
        type: choice
        options: [score, extract, links, verify]
        default: score
      models:
        description: Comma-separated model names from the fact_extraction_trial routing role
        required: true
        type: string
        default: OpenRouter Large, OpenRouter Medium, Gemma 4 31B, Gemini 3.1 Flash Lite, Gemini 3.5 Flash Lite, OpenRouter Compare
      limit:
        description: Score only the first N sentences of the key (0 = all)
        required: true
        type: number
        default: 0
      records_run:
        description: verify only, optional - reuse records.json saved by this earlier run id instead of extracting again
        required: false
        type: string
        default: ''

permissions:
  contents: read

# Shares the V2.1 group, so experiment runs never overlap.
concurrency:
  group: source-first-v2-1
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out private research data
        uses: actions/checkout@v7
        with:
          repository: zenkio/hk-history-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
          fetch-depth: 0

      - name: Check out research code
        uses: actions/checkout@v7
        with:
          path: _code
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Overlay research code in isolated workspace
        run: |
          set -euo pipefail
          rsync -a --exclude .git --exclude .github --exclude .gitignore \
            --exclude README.md --exclude CLAUDE.md --exclude LICENSE \
            --exclude CODE_OF_CONDUCT.md _code/ data/
          rm -rf _code

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install research dependencies
        working-directory: data
        run: pip install -r requirements.txt --quiet

      # Model replies and sentences stay private: all script output goes to the private log.
      - name: Score models
        working-directory: data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPEN_ROUTER_KEY_RESEARCHER: ${{ secrets.OPEN_ROUTER_KEY_RESEARCHER }}
          MODE: ${{ inputs.mode }}
          MODELS: ${{ inputs.models }}
          LIMIT: ${{ inputs.limit }}
          RECORDS_RUN: ${{ inputs.records_run }}
          PRIVATE_OUTPUT: ${{ runner.temp }}/v2-2-output
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$PRIVATE_OUTPUT"
          limit_args=()
          if [[ "$LIMIT" =~ ^([1-9][0-9]*)(\.0+)?$ ]]; then
            limit_args=(--limit "${BASH_REMATCH[1]}")
          fi
          failed=0
          if [[ "$MODE" == verify && -n "$RECORDS_RUN" ]]; then
            model="$(cut -d, -f1 <<<"$MODELS" | xargs)"
            if [[ "$RECORDS_RUN" =~ ^[0-9]+$ ]]; then
              git show "origin/experiment/v2-2-model-scores-$RECORDS_RUN:experiments/v2-2/model-runs/$RECORDS_RUN/records.json" \
                >"$PRIVATE_OUTPUT/records.json" 2>"$PRIVATE_OUTPUT/diagnostics.log" || failed=1
            else
              echo "records_run must be a run id" >"$PRIVATE_OUTPUT/diagnostics.log"; failed=1
            fi
            if [[ $failed == 0 ]]; then
              python3 -u scripts/find_independent_records.py --model "$model" \
                --records "$PRIVATE_OUTPUT/records.json" \
                --output "$PRIVATE_OUTPUT/candidates.json" >>"$PRIVATE_OUTPUT/diagnostics.log" 2>&1 || failed=1
            fi
          elif [[ "$MODE" == extract || "$MODE" == verify ]]; then
            model="$(cut -d, -f1 <<<"$MODELS" | xargs)"
            python3 -u scripts/extract_records.py --model "$model" \
              --packets experiments/v2-1/source-packets \
              --output "$PRIVATE_OUTPUT/records.json" >"$PRIVATE_OUTPUT/diagnostics.log" 2>&1 || failed=1
            if [[ "$MODE" == verify && $failed == 0 ]]; then
              python3 -u scripts/find_independent_records.py --model "$model" \
                --records "$PRIVATE_OUTPUT/records.json" \
                --output "$PRIVATE_OUTPUT/candidates.json" >>"$PRIVATE_OUTPUT/diagnostics.log" 2>&1 || failed=1
            fi
          elif [[ "$MODE" == links ]]; then
            python3 -u scripts/score_links.py --minutes 100 \
              --key experiments/v2-2/answer-key.json \
              --link-key experiments/v2-2/link-key.json \
              --packets experiments/v2-1/source-packets \
              --models "$MODELS" \
              --output "$PRIVATE_OUTPUT/links.json" >"$PRIVATE_OUTPUT/diagnostics.log" 2>&1 || failed=1
          else
            # --minutes stays well under the job timeout, so scores are saved (run 38531845034 kept none).
            python3 -u scripts/score_extraction_models.py --minutes 100 \
              --key experiments/v2-2/answer-key.json \
              --packets experiments/v2-1/source-packets \
              --models "$MODELS" "${limit_args[@]}" \
              --output "$PRIVATE_OUTPUT/scores.json" >"$PRIVATE_OUTPUT/diagnostics.log" 2>&1 || failed=1
          fi
          echo "V2.2 $MODE | status=$([[ $failed == 0 ]] && echo completed || echo failed) | private output"
          exit "$failed"

      - name: Save scores to private experiment branch
        if: always()
        working-directory: data
        env:
          PRIVATE_OUTPUT: ${{ runner.temp }}/v2-2-output
          PRIVATE_BRANCH: experiment/v2-2-model-scores-${{ github.run_id }}
        run: |
          set -euo pipefail
          test -d "$PRIVATE_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$PRIVATE_BRANCH"
          target="experiments/v2-2/model-runs/${GITHUB_RUN_ID}"
          mkdir -p "$target"
          cp "$PRIVATE_OUTPUT"/* "$target/"
          git add "$target"
          git commit -m "experiment: save v2.2 model scores"
          git push origin "$PRIVATE_BRANCH"
          echo "Private v2.2 scores saved to $PRIVATE_BRANCH"
